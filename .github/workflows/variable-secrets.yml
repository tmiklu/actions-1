name: Exploring Variables and Secrets

on:
    push

env:
    CONTAINER_REGISTRY: docker.io
    DOCKER_USERNAME: abcx
    IMAGE_NAME: github-actions-nginx 

jobs:
  docker:
    env:
        CONTAINER_REGISTRY: docker.io
        DOCKER_USERNAME: abcx
        IMAGE_NAME: github-actions-nginx    
    runs-on: ubuntu-latest
    steps:
      - name: Docker Build
        #env: # step level variables
        #  CONTAINER_REGISTRY: docker.io
        #  DOCKER_USERNAME: abcx
        #  IMAGE_NAME: github-actions-nginx
        run: echo docker build -t $CONTAINER_REGISTRY/${{ env.DOCKER_USERNAME }}/$IMAGE_NAME:latest
      
      - name: Docker Login
        env:
            DOCKER_PASSWORD: abcxfasdasd
        run: echo docker login --username=${{ env.DOCKER_USERNAME }} --password=$DOCKER_PASSWORD
      
      - name: Docker Publish
        run: echo docker push docker.io/$DOCKER_USERNAME/$IMAGE_NAME:latest

  deploy:
    #env: # job level variables
    #    CONTAINER_REGISTRY: docker.io
    #    DOCKER_USERNAME: abcx
    #    IMAGE_NAME: github-actions-nginx
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Docker Run
        run: echo docker run -d -p 8080:80 $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest